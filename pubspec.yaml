name: gorm_wiki
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  google_fonts: ^8.0.1
  sqflite: ^2.4.0
  path: ^1.9.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  dynamic_color: ^1.7.0
  collection: ^1.19.1

dependency_overrides:
  win32: ^5.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/img/
    - lib/assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "lib/assets/icon/icon.png"
  min_sdk_android: 24
